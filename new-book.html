<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bootstrap dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="/img/duck.png" type="image/png">
</head>

<body class="bg-white">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <!-- Brand Header -->
            <a class="navbar-brand" href="#"><img
                    src="C:/Users/HP/Documents/boolean/htmlcss-bootstrap-dashboard/img/duck.png" alt="duck"
                    style="width: 50px;"></a>

            <!-- Toggler Mobile/Tablet -->
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenuto Offcanvas -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Catalogo Libri</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>

                <div class="offcanvas-body align-items-center">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Catalogo Libri</a>
                        </li>
                        <a class="nav-link" href="#">Anagrafia Utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Storico Prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Help</a>
                        </li>
                    </ul>

                    <form class="d-flex mt-3 mt-lg-0" role="search">
                        <input class="form-control me-2" type="search" placeholder="Cerca..." aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Cerca</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 900px;">

        <!-- Header -->
        <header class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="">Nuovo Libro</h2>
        </header>

        <div class="input-group mb-3">
            <form class="row g-3">

                <div class="col-6 mb-1">
                    <label for="first-name" class="form-label">Nome Autore</label>
                    <input type="text" class="form-control" id="first-name" placeholder="Inserisci il nome dell'autore">
                </div>
                <div class="col-6 mb-1">
                    <label for="last-name" class="form-label">Cognome Autore</label>
                    <input type="text" class="form-control" id="last-name"
                        placeholder="Inserisci il cognome dell'autore">
                </div>

                <div class="col-12 mb-1">
                    <label for="inputTitle" class="form-label">Titolo</label>
                    <input type="text" class="form-control" id="inputTitle" placeholder="Inserisci il titolo del libro">
                    <label for="inputTitle" class="form-label text-body-secondary small">Titolo versione
                        italiana</label>
                </div>

                <div class="col-12 mb-1">
                    <label for="inputTitle" class="form-label">Genere</label>
                    <select class="form-select" aria-label="select genre">
                        <option selected>Scegli il genere</option>
                        <option value="1">Avventura</option>
                        <option value="2">Biografia</option>
                        <option value="3">Classici</option>
                        <option value="4">Fantasy</option>
                        <option value="5">Gialli</option>
                        <option value="6">Horror</option>
                        <option value="7">Narrativa Contemporanea</option>
                        <option value="8">Poesia</option>
                        <option value="9">Romanzi Storici</option>
                        <option value="10">Thriller</option>
                    </select>
                </div>

                <div class="col-12 mb-1">
                    <label for="inputDate" class="form-label">Anno di Pubblicazione</label>
                    <input type="text" class="form-control" id="inputDate" placeholder="Inserisci l'anno">
                </div>

                <div class="col-12 mb-4">
                    <label for="inputTitle" class="form-label">ISBN#</label>
                    <input type="text" class="form-control" id="inputTitle" placeholder="Inserisci il codice ISBN#">
                </div>

                <span class="col-12 my-2 border"></span>

                <div class="mb-1">
                    <label for="inputNote" class="form-label">Note</label>
                    <textarea class="form-control" id="inputNote" placeholder="Inserisci eventuali note sul libro"
                        rows="4"></textarea>
                </div>

                <div class="col-12 mb-1">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gridCheck">
                        <label class="form-check-label" for="gridCheck">
                            Disponibile anche in digitale
                        </label>
                    </div>
                </div>

                <div class="col-12 mb-3">
                    <button type="submit" class="btn btn-primary">Aggiungi Libro</button>
                </div>
            </form>

        </div>

    </div>


</body>
